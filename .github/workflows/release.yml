name: Release installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: echo "version=$(python3 scripts/check_release_version.py '${{ github.ref_name }}' .)" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ef7dbf94b9198bc58f45951adcf1f041fcbc5ea0
      - name: Configure CLI (/MT)
        shell: pwsh
        run: >-
          cmake -S client -B client/build-cli-release -A x64
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DNOX_BUILD_CLI=ON -DNOX_BUILD_GUI=OFF -DNOX_MSVC_STATIC_RUNTIME=ON
          -DVCPKG_MANIFEST_FEATURES=tests
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build and test CLI
        run: |
          cmake --build client/build-cli-release --config Release --parallel
          ctest --test-dir client/build-cli-release -C Release --output-on-failure
          client\build-cli-release\Release\nox.exe --version
          client\build-cli-release\Release\nox.exe --help
          client\build-cli-release\Release\nox.exe doctor
      - name: Configure GUI (/MD)
        shell: pwsh
        run: >-
          cmake -S client -B client/build-gui-release -A x64
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DNOX_BUILD_CLI=OFF -DNOX_BUILD_GUI=ON -DNOX_MSVC_STATIC_RUNTIME=OFF
          -DVCPKG_MANIFEST_FEATURES=tests
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build and test GUI
        shell: pwsh
        run: |
          cmake --build client/build-gui-release --config Release --parallel
          ctest --test-dir client/build-gui-release -C Release --output-on-failure
          & client\build-gui-release\Release\nox_agent_entrypoint_tests.exe `
            client\build-cli-release\Release\nox.exe client\build-gui-release\Release\nox_gui.exe
          if ($LASTEXITCODE -ne 0) { throw 'CLI/GUI shared-agent interoperability failed' }
          $smoke = Start-Process "client\build-gui-release\Release\nox_gui.exe" -ArgumentList '--smoke-test' -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "GUI smoke test failed with $($smoke.ExitCode)" }
      - name: Build combined staging tree
        run: |
          cmake --install client/build-cli-release --config Release --prefix "${{ runner.temp }}\nox-stage"
          cmake --install client/build-gui-release --config Release --prefix "${{ runner.temp }}\nox-stage"
      - name: Inspect staged runtimes
        shell: pwsh
        run: |
          $stage = "${{ runner.temp }}\nox-stage"
          if (!(Test-Path "$stage\NOX Vault.exe")) { throw 'GUI executable missing' }
          if (!(Test-Path "$stage\platforms\qwindows.dll")) { throw 'Qt platform plugin missing' }
          $cliDeps = (dumpbin /dependents "$stage\bin\nox.exe") -join "`n"
          if ($cliDeps -match 'VCRUNTIME|MSVCP140') { throw 'CLI no longer uses the static MSVC runtime' }
          $guiDeps = (dumpbin /dependents "$stage\NOX Vault.exe") -join "`n"
          if ($guiDeps -notmatch 'VCRUNTIME140') { throw 'GUI is not using the expected dynamic MSVC runtime' }
          $smoke = Start-Process "$stage\NOX Vault.exe" -ArgumentList '--smoke-test' -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Staged GUI smoke failed with $($smoke.ExitCode)" }
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build MSI
        shell: pwsh
        run: |
          wix extension add --global WixToolset.UI.wixext/5.0.2
          wix build packaging/windows/NOXVaultCliUpgradeFixture.wxs `
            -arch x64 -d StageDir="${{ runner.temp }}\nox-stage" `
            -o "${{ runner.temp }}\NOX-Vault-CLI-upgrade-fixture.msi"
          wix build packaging/windows/NOXVault.wxs `
            -arch x64 -ext WixToolset.UI.wixext `
            -d ProductVersion="${{ needs.version.outputs.version }}" `
            -d StageDir="${{ runner.temp }}\nox-stage" `
            -d ProjectDir="${{ github.workspace }}" `
            -d AssetsDir="${{ github.workspace }}\packaging\assets" `
            -d LicenseRtf="${{ github.workspace }}\packaging\windows\license.rtf" `
            -o "NOX-Vault-${{ needs.version.outputs.version }}-windows-x64.msi"
      - name: Smoke-test MSI install and uninstall
        shell: pwsh
        run: |
          $msi = (Resolve-Path "NOX-Vault-${{ needs.version.outputs.version }}-windows-x64.msi").Path
          $fixture = "${{ runner.temp }}\NOX-Vault-CLI-upgrade-fixture.msi"
          $oldInstall = Start-Process msiexec.exe -ArgumentList @('/i', $fixture, '/qn', '/norestart') -Wait -PassThru
          if ($oldInstall.ExitCode -ne 0) { throw "CLI-only fixture install failed with $($oldInstall.ExitCode)" }
          if (!(Test-Path "$env:ProgramFiles\NOX Vault\bin\nox.exe")) { throw 'CLI-only fixture did not install nox.exe' }
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "MSI install failed with $($install.ExitCode)" }
          & "$env:ProgramFiles\NOX Vault\bin\nox.exe" --version
          & "$env:ProgramFiles\NOX Vault\bin\nox.exe" --help
          & "$env:ProgramFiles\NOX Vault\bin\nox.exe" doctor
          $gui = Start-Process "$env:ProgramFiles\NOX Vault\NOX Vault.exe" -ArgumentList '--smoke-test' -Wait -PassThru
          if ($gui.ExitCode -ne 0) { throw "Installed GUI smoke failed with $($gui.ExitCode)" }
          if (!(Test-Path "$env:ProgramFiles\NOX Vault\platforms\qwindows.dll")) { throw 'Qt platform plugin was not installed' }
          if (!(Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\NOX Vault.lnk")) { throw 'Start Menu shortcut missing' }
          $systemPath = (Get-ItemProperty `
            'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment' `
            -Name Path).Path
          $expectedPath = [IO.Path]::GetFullPath("$env:ProgramFiles\NOX Vault\bin").TrimEnd('\')
          $registeredPaths = $systemPath -split ';' | ForEach-Object {
            [Environment]::ExpandEnvironmentVariables($_).Trim().TrimEnd('\')
          }
          $noxPathEntries = @($registeredPaths | Where-Object {
            [string]::Equals($_, $expectedPath, [StringComparison]::OrdinalIgnoreCase)
          })
          if ($noxPathEntries.Count -ne 1) {
            Write-Host "Expected PATH entry: $expectedPath"
            Write-Host "Machine PATH entries: $($registeredPaths -join ' | ')"
            throw 'MSI did not register NOX Vault in the machine PATH'
          }
          $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', $msi, '/qn', '/norestart') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "MSI uninstall failed with $($uninstall.ExitCode)" }
          if (Test-Path "$env:ProgramFiles\NOX Vault\bin\nox.exe") { throw 'MSI uninstall left nox.exe behind' }
          if (Test-Path "$env:ProgramFiles\NOX Vault\NOX Vault.exe") { throw 'MSI uninstall left the GUI behind' }
          if (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\NOX Vault.lnk") { throw 'MSI uninstall left the shortcut behind' }
      - name: Future Windows signing hook
        if: ${{ vars.ENABLE_WINDOWS_SIGNING == 'true' }}
        run: echo "Signing was enabled, but the certificate-backed signing command must be configured first." && exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: NOX-Vault-${{ needs.version.outputs.version }}-windows-x64.msi
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ef7dbf94b9198bc58f45951adcf1f041fcbc5ea0
      - name: Install build prerequisites
        run: brew install autoconf automake libtool ninja
      - name: Configure
        run: >-
          cmake -S client -B client/build-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DNOX_BUILD_CLI=ON -DNOX_BUILD_GUI=OFF
          -DVCPKG_MANIFEST_FEATURES=tests
          -DVCPKG_TARGET_TRIPLET=arm64-osx-release
          -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/packaging/triplets"
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build and test
        run: |
          cmake --build client/build-release --parallel
          ctest --test-dir client/build-release --output-on-failure
          client/build-release/nox --version
          client/build-release/nox --help
          test "$(lipo -archs client/build-release/nox)" = "arm64"
      - name: Stage and build package
        run: |
          cmake --install client/build-release --prefix "$RUNNER_TEMP/nox-stage"
          chmod +x packaging/macos/build-package.sh packaging/macos/uninstall-nox-vault
          packaging/macos/build-package.sh "${{ needs.version.outputs.version }}" \
            "$RUNNER_TEMP/nox-stage" packaging/assets \
            "NOX-Vault-${{ needs.version.outputs.version }}-macos-arm64.pkg"
          pkgutil --check-signature "NOX-Vault-${{ needs.version.outputs.version }}-macos-arm64.pkg" || true
          pkgutil --expand-full "NOX-Vault-${{ needs.version.outputs.version }}-macos-arm64.pkg" "$RUNNER_TEMP/pkg-expanded"
          find "$RUNNER_TEMP/pkg-expanded" -type f -print
      - name: Smoke-test PKG install and uninstall
        run: |
          sudo installer -pkg "NOX-Vault-${{ needs.version.outputs.version }}-macos-arm64.pkg" -target /
          /usr/local/bin/nox --version
          /usr/local/bin/nox --help
          /usr/local/bin/nox doctor
          test "$(lipo -archs /usr/local/bin/nox)" = "arm64"
          sudo /usr/local/share/nox-vault/uninstall-nox-vault
          test ! -e /usr/local/bin/nox
      - name: Future Apple signing and notarization hook
        if: ${{ vars.ENABLE_APPLE_SIGNING == 'true' }}
        run: echo "Signing was enabled, but Developer ID and notarization commands must be configured first." && exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: NOX-Vault-${{ needs.version.outputs.version }}-macos-arm64.pkg
          if-no-files-found: error

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            triplet: x64-linux-release
            deb_arch: amd64
          - runner: ubuntu-22.04-arm
            triplet: arm64-linux-release
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ef7dbf94b9198bc58f45951adcf1f041fcbc5ea0
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config
      - name: Configure
        run: >-
          cmake -S client -B client/build-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DNOX_BUILD_CLI=ON -DNOX_BUILD_GUI=OFF
          -DVCPKG_MANIFEST_FEATURES=tests
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/packaging/triplets"
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build and test
        run: |
          cmake --build client/build-release --parallel
          ctest --test-dir client/build-release --output-on-failure
          client/build-release/nox --version
          client/build-release/nox --help
      - name: Build and inspect DEB
        run: |
          cd client/build-release
          cpack -G DEB
          package="$(find . -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
          mv "$package" "${{ github.workspace }}/nox-vault_${{ needs.version.outputs.version }}_${{ matrix.deb_arch }}.deb"
      - name: Test supported Linux distributions
        run: |
          package="nox-vault_${{ needs.version.outputs.version }}_${{ matrix.deb_arch }}.deb"
          for image in ubuntu:22.04 ubuntu:24.04 debian:12; do
            docker run --rm -v "$PWD:/work:ro" "$image" sh -euxc \
              "apt-get update; apt-get install -y /work/$package; nox --version; nox --help; test -x /usr/bin/nox"
          done
      - name: Smoke-test DEB install and uninstall
        run: |
          sudo apt-get install -y "./nox-vault_${{ needs.version.outputs.version }}_${{ matrix.deb_arch }}.deb"
          /usr/bin/nox --version
          /usr/bin/nox --help
          /usr/bin/nox doctor
          sudo apt-get remove -y nox-vault
          test ! -e /usr/bin/nox
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.deb_arch }}
          path: nox-vault_${{ needs.version.outputs.version }}_${{ matrix.deb_arch }}.deb
          if-no-files-found: error

  publish:
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*installer"
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum ./* > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" release-assets/* --clobber
            gh release edit "${{ github.ref_name }}" \
              --title "NOX Vault ${{ needs.version.outputs.version }}" \
              --latest
          else
            gh release create "${{ github.ref_name }}" release-assets/* \
              --verify-tag --generate-notes \
              --title "NOX Vault ${{ needs.version.outputs.version }}"
          fi
