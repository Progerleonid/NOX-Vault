name: Release installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            triplet: x64-windows-static
            arch: x86_64
            generators: NSIS;ZIP
          - name: Linux x64
            # Build on the oldest supported Ubuntu runner for broader glibc compatibility.
            os: ubuntu-22.04
            triplet: x64-linux
            arch: x86_64
            generators: DEB;RPM;TGZ
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            triplet: arm64-linux
            arch: arm64
            generators: DEB;RPM;TGZ
          - name: macOS Apple Silicon
            os: macos-15
            triplet: arm64-osx
            arch: arm64
            generators: productbuild;TGZ
          - name: macOS Intel
            os: macos-15-intel
            triplet: x64-osx
            arch: x86_64
            generators: productbuild;TGZ

    runs-on: ${{ matrix.os }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.release-vcpkg
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"

    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          project_version="$(sed -nE 's/^project\(nox_vault_client VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' client/CMakeLists.txt)"
          test "v$project_version" = "${{ github.ref_name }}" || {
            echo "Tag ${{ github.ref_name }} does not match client version v$project_version" >&2
            exit 1
          }
      - name: Install native packager
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            choco install nsis --yes --no-progress
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y ninja-build rpm
          fi
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: vcpkg-binaries-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('client/vcpkg.json') }}
      - name: Bootstrap vcpkg
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/.vcpkg-binary-cache"
          if [[ ! -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" ]]; then
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi
      - name: Configure
        shell: bash
        run: >-
          cmake -S client -B client/build-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}"
          -DNOX_PACKAGE_ARCH="${{ matrix.arch }}"
          -DCPACK_GENERATOR="${{ matrix.generators }}"
      - name: Build and test
        shell: bash
        run: |
          cmake --build client/build-release
          ctest --test-dir client/build-release --output-on-failure
      - name: Build installers
        shell: bash
        run: |
          mkdir -p release-assets
          cpack --config client/build-release/CPackConfig.cmake -B release-assets
      - name: Smoke-test installed tree
        shell: bash
        run: |
          cmake --install client/build-release --prefix "$RUNNER_TEMP/nox-smoke"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            "$RUNNER_TEMP/nox-smoke/bin/nox.exe" --version
          else
            "$RUNNER_TEMP/nox-smoke/bin/nox" --version
          fi
      - name: Verify dependencies are bundled
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            if ldd "$RUNNER_TEMP/nox-smoke/bin/nox" | grep -E 'libsodium|libcurl'; then
              echo "Release unexpectedly depends on non-system curl/libsodium" >&2
              exit 1
            fi
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            if otool -L "$RUNNER_TEMP/nox-smoke/bin/nox" | grep -E '/(opt/homebrew|usr/local|release-vcpkg)/'; then
              echo "Release unexpectedly depends on a package-manager library" >&2
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.triplet }}
          path: |
            release-assets/*.exe
            release-assets/*.zip
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.pkg
            release-assets/*.tar.gz
            release-assets/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - name: Create combined checksums
        working-directory: release-assets
        run: |
          find . -maxdepth 1 -type f ! -name '*.sha256' -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release-assets/*
          --repo "${{ github.repository }}"
          --generate-notes
          --title "NOX Vault ${{ github.ref_name }}"
