name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nox_vault_test
          POSTGRES_USER: nox
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nox -d nox_vault_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://nox:test-only-password@localhost:5432/nox_vault_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: python -m pip install -e "server[dev]"
      - run: ruff check server
      - run: pytest server

  client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libsodium-dev libcurl4-openssl-dev nlohmann-json3-dev
      - run: |
          git clone --depth 1 https://github.com/CLIUtils/CLI11.git /tmp/CLI11
          cmake -S /tmp/CLI11 -B /tmp/CLI11/build -DCLI11_BUILD_TESTS=OFF
          sudo cmake --install /tmp/CLI11/build
      - run: |
          git clone --depth 1 --branch v3.8.1 https://github.com/catchorg/Catch2.git /tmp/Catch2
          cmake -S /tmp/Catch2 -B /tmp/Catch2/build -G Ninja -DCATCH_BUILD_TESTING=OFF
          cmake --build /tmp/Catch2/build
          sudo cmake --install /tmp/Catch2/build
      - run: cmake -S client -B client/build -G Ninja -DNOX_BUILD_CLI=ON -DNOX_BUILD_GUI=OFF
      - run: cmake --build client/build
      - run: ctest --test-dir client/build --output-on-failure
      - run: cmake --install client/build --prefix "$RUNNER_TEMP/nox-install"
      - run: cd /tmp && "$RUNNER_TEMP/nox-install/bin/nox" --version

  windows-client:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ef7dbf94b9198bc58f45951adcf1f041fcbc5ea0
      - name: Configure, build and test static CLI
        shell: pwsh
        run: |
          cmake -S client -B client/build-ci-cli -A x64 -DBUILD_TESTING=ON `
            -DNOX_BUILD_CLI=ON -DNOX_BUILD_GUI=OFF -DNOX_MSVC_STATIC_RUNTIME=ON `
            -DVCPKG_MANIFEST_FEATURES=tests -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build client/build-ci-cli --config Release --parallel
          ctest --test-dir client/build-ci-cli -C Release --output-on-failure
      - name: Configure, build and test dynamic GUI
        shell: pwsh
        run: |
          cmake -S client -B client/build-ci-gui -A x64 -DBUILD_TESTING=ON `
            -DNOX_BUILD_CLI=OFF -DNOX_BUILD_GUI=ON -DNOX_MSVC_STATIC_RUNTIME=OFF `
            -DVCPKG_MANIFEST_FEATURES=tests -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build client/build-ci-gui --config Release --parallel
          ctest --test-dir client/build-ci-gui -C Release --output-on-failure
          & client/build-ci-gui/Release/nox_agent_entrypoint_tests.exe `
            client/build-ci-cli/Release/nox.exe client/build-ci-gui/Release/nox_gui.exe
          if ($LASTEXITCODE -ne 0) { throw 'CLI/GUI shared-agent interoperability failed' }
          $smoke = Start-Process 'client/build-ci-gui/Release/nox_gui.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "GUI smoke failed with $($smoke.ExitCode)" }

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build
      - run: cp deploy/.env.production.example deploy/.env.production
      - run: docker compose --env-file deploy/.env.production -f docker-compose.prod.yml config
