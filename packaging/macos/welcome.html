<h2>Install NOX Vault</h2>
<p>NOX Vault encrypts and decrypts your secrets locally. This package installs the <code>nox</code> command-line client for all users.</p>
<p>The backend is not installed; the client uses <code>https://api.noxvault.tech</code>.</p>
