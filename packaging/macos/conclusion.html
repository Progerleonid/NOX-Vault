<!doctype html><html><body style="font-family:-apple-system; padding:12px">
<h2>NOX Vault is ready</h2>
<p>Open a new Terminal window and run <code>nox --help</code> or <code>nox register</code>.</p>
<p>To remove the client later, run <code>sudo /usr/local/share/nox-vault/uninstall-nox-vault</code>. Your files in <code>~/.config/nox</code> will be preserved.</p>
</body></html>
